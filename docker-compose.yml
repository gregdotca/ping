services:

  web:
    container_name: ping
    build:
      context: ./services/web
      dockerfile: Dockerfile
    command: bash -c 'gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 4 --no-control-socket manage:app'
    ports:
      - 8102:5000
    restart: unless-stopped
    environment:
      - FLASK_APP=project/__init__.py
